name: Deploy to AWS Elastic Beanstalk

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: aws-production-deployment
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  EB_APPLICATION_NAME: YOUR_APPLICATION_NAME
  EB_ENVIRONMENT_NAME: YOUR_ENVIRONMENT_NAME

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Validate Docker build
      - name: Build Docker image
        run: |
          docker build \
            --platform linux/amd64 \
            -t application:ci .

      # 4. Authenticate with AWS using OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      # 5. Verify AWS identity
      - name: Verify AWS identity
        run: aws sts get-caller-identity

      # 6. Deploy to Elastic Beanstalk
      - name: Deploy to Elastic Beanstalk
        uses: aws-actions/aws-elasticbeanstalk-deploy@v1
        with:
          aws-region: ${{ env.AWS_REGION }}
          application-name: ${{ env.EB_APPLICATION_NAME }}
          environment-name: ${{ env.EB_ENVIRONMENT_NAME }}
