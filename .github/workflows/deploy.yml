name: Deploy to AWS Elastic Beanstalk

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: aws-production-deployment
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  EB_APPLICATION_NAME: sutra
  EB_ENVIRONMENT_NAME: sutra-pod

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio

      - name: Run Pytest
        env:
          GNANI_MODE: mock
          GROQ_API_KEY: mock_key
        run: |
          PYTHONPATH=. pytest apps/api/tests/ -v

  deploy:
    name: Deploy to Elastic Beanstalk (Python 3.11)
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Package Application Bundle
        run: |
          zip -r deploy.zip . \
            -x "*.git*" \
            -x ".github/*" \
            -x "apps/api/.venv/*" \
            -x ".pytest_cache/*" \
            -x "*/__pycache__/*" \
            -x "__pycache__/*" \
            -x "tests/*" \
            -x "apps/api/tests/*"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Deploy to Elastic Beanstalk
        uses: aws-actions/aws-elasticbeanstalk-deploy@v1
        with:
          aws-region: ${{ env.AWS_REGION }}
          application-name: ${{ env.EB_APPLICATION_NAME }}
          environment-name: ${{ env.EB_ENVIRONMENT_NAME }}
          version-label: sutra-${{ github.sha }}-${{ github.run_number }}
          deployment-package-path: deploy.zip
          use-existing-application-version-if-available: true

      - name: Verify Elastic Beanstalk Environment Health
        run: |
          echo "Verifying deployment for ${{ env.EB_ENVIRONMENT_NAME }}..."
          aws elasticbeanstalk describe-environments \
            --application-name "${{ env.EB_APPLICATION_NAME }}" \
            --environment-names "${{ env.EB_ENVIRONMENT_NAME }}" \
            --query "Environments[0].{Status:Status,Health:Health,HealthStatus:HealthStatus,CNAME:CNAME}" \
            --output table
