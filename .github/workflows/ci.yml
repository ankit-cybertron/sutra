name: VoxSpec CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-format:
    name: Gate 1 - Lint and Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package.json

      - name: Install Python dev tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pydantic-settings fastapi

      - name: Run Ruff and Mypy
        run: |
          cd apps/api
          ruff check .
          mypy --strict app/

      - name: Install Web dependencies and typecheck
        run: |
          cd apps/web
          npm install
          npm run lint || true
          npx tsc --noEmit

  tests:
    name: Gate 2 - Unit, Property & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install API dependencies & test tools
        run: |
          python -m pip install --upgrade pip
          cd apps/api
          pip install .[dev]

      - name: Run Pytest with coverage
        run: |
          cd apps/api
          pytest --cov=app --cov-report=term-missing tests/

  e2e:
    name: Gate 3 - Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Web deps & Playwright
        run: |
          cd apps/web
          npm install
          npx playwright install --with-deps chromium || true

      - name: Run Playwright
        run: |
          echo "Playwright suite wired (full execution in Phase 4)"

  eval-smoke:
    name: Gate 4 - Eval Smoke Benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Eval Smoke Gate
        run: |
          echo "Eval smoke gate wired (benchmark runner active in Phase 6)"

  security:
    name: Gate 5 - Security Audits & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python dependency audit
        run: |
          pip install pip-audit
          pip-audit || true

      - name: Web dependency audit
        run: |
          cd apps/web
          npm audit --omit=dev || true

  docker-build:
    name: Gate 6 - Container Build & Healthcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Compose services
        run: |
          cp .env.example .env
          docker compose build

      - name: Test Docker Run & Healthcheck
        run: |
          docker compose up -d
          sleep 10
          curl -f http://localhost:8000/healthz || exit 1
          docker compose down
